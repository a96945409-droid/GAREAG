<!doctype html><html lang=ja><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ガレージハンターズ</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel=stylesheet>
<style>:root{--y:#f5c430;--bg:#0c0e11;--ink:#f2f0e8;--dim:#a9a79e;--pan:rgba(14,16,20,.88)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#g{position:fixed;inset:0;width:100%;height:100%;display:block}.f{position:fixed;pointer-events:none}
#cross{left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;box-shadow:0 0 4px #000}#hm{left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;border:2px solid #fff;transform:rotate(45deg)}#hm.h{border-color:#ffd23c}
#hud{inset:0}#hpw{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:18px;width:min(250px,28vw)}#hpb{height:12px;background:#0009;border:1px solid #fff5;transform:skewX(-12deg);overflow:hidden}#hp{height:100%;background:linear-gradient(90deg,#3cc060,#9cf080);width:100%}.lb{font-size:12px;color:var(--dim);text-shadow:0 1px 3px #000}#money{font-size:18px;color:var(--y);text-shadow:0 2px 4px #000}
#slots{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}.sl{width:84px;height:84px;background:var(--pan);border:2px solid #fff3;position:relative;display:flex;align-items:center;justify-content:center}.sl:first-child{border-color:var(--y);width:96px;height:96px;margin-top:-12px}.sl img{width:80%;height:80%;object-fit:contain}.sl b{position:absolute;left:4px;top:2px;font-size:10px;color:var(--y)}.sl em{position:absolute;left:0;right:0;bottom:1px;text-align:center;font:700 10px/1.1 inherit;font-style:normal;text-shadow:0 1px 2px #000}
#ammoW{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:16px;text-align:right;text-shadow:0 2px 4px #000}#magT{font:44px "Dela Gothic One"}#ammoB{font-size:13px;color:var(--y)}
#map{position:absolute;right:14px;top:14px;width:240px;height:120px;border:1px solid #fff4}#map.big{width:min(720px,80vw);height:min(360px,40vw);right:50%;transform:translateX(50%);top:12%}
#boss{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:min(620px,62vw);text-align:center;display:none}#bossN{font-size:14px;text-shadow:0 2px 4px #000;letter-spacing:.1em}#bossB{height:12px;background:#0009;border:1px solid #fff5}#bossH{height:100%;background:linear-gradient(90deg,#a01810,#ff5a30)}
#pr{left:50%;top:60%;transform:translateX(-50%);padding:6px 16px;background:var(--pan);border-left:4px solid var(--y);opacity:0;white-space:nowrap}#toast{left:50%;top:18%;transform:translateX(-50%);color:var(--y);text-shadow:0 2px 6px #000;opacity:0;transition:.3s;white-space:nowrap}#ban{left:0;right:0;top:26%;text-align:center;font:30px "Dela Gothic One";text-shadow:0 2px 12px #000;opacity:0}#ban.s{animation:bn 3.6s}@keyframes bn{0%{opacity:0;transform:scale(1.2)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
#obj{position:absolute;left:18px;top:64px;max-width:42vw;padding:6px 10px;background:var(--pan);border-left:4px solid var(--y);font-size:14px}#truckT{position:absolute;left:18px;top:14px;font-size:13px;display:none;text-shadow:0 1px 3px #000}#roomT{position:absolute;left:18px;top:36px;font-size:12px;color:var(--dim)}
#load{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;background:repeating-linear-gradient(-45deg,#0c0e11 0 40px,#14171b 40px 80px)}#loadT{font:34px "Dela Gothic One";color:var(--y)}#loadB{width:280px;height:6px;margin-top:18px;background:#fff2;overflow:hidden}#loadB i{display:block;height:100%;width:40%;background:var(--y);animation:lb 1s infinite linear}@keyframes lb{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#title{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 70% 20%,#3a2a1c,#0a0b0e 70%);display:flex;align-items:center;padding:0 clamp(20px,6vw,90px);overflow:auto}#title h1{font:clamp(38px,8vw,92px)/1 "Dela Gothic One";margin:0;color:var(--y);text-shadow:4px 4px 0 #000}#title p{color:var(--dim);margin:8px 0 22px}.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}input,select{background:#1a1d22;border:1px solid #fff3;color:var(--ink);padding:10px;font:inherit}button{font:inherit;cursor:pointer}.big{background:var(--y);color:#111;border:0;padding:14px 28px;font-weight:900;font-size:17px}.big:disabled{opacity:.4}.sec{background:#23272d;color:var(--ink);border:1px solid #fff3;padding:12px 18px}.ch{background:#1a1d22;border:2px solid #fff2;color:var(--ink);padding:9px 16px}.ch.on{border-color:var(--y);color:var(--y)}#ttMsg{color:var(--y);min-height:20px;font-size:14px}
#panel{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#0008;padding:12px}#panelW{width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--pan);border-top:5px solid var(--y)}#panelH{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font:22px "Dela Gothic One"}#panelB{overflow:auto;padding:0 16px 16px;touch-action:pan-y}.row{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #fff1}.row>div{flex:1}.row img{width:56px;height:56px;object-fit:contain}.row small{display:block;color:var(--dim);font-size:12px}.rc{font-size:12px;color:var(--y)}.row button{background:var(--y);color:#111;border:0;padding:9px 16px;font-weight:900}.row button:disabled{background:#3a3d42;color:#888}.mats{font-size:12px;color:var(--dim);padding:8px;background:#fff1;margin-bottom:8px;line-height:1.7}.mats b{color:var(--y);display:block;font-size:15px}h3{margin:12px 0 2px;color:var(--y)}
#pause{position:fixed;inset:0;z-index:28;display:none;align-items:center;justify-content:center;background:#000b}#pauseW{background:var(--pan);padding:22px;width:min(420px,92vw);line-height:1.9}.keysT{font-size:12px;color:var(--dim)}
#tc{position:fixed;inset:0;display:none;z-index:6}body.touch #tc{display:block}#joy{position:absolute;display:none;width:124px;height:124px;margin:-62px;border-radius:50%;border:2px solid #fff5;background:#0003}#joyK{position:absolute;left:34px;top:34px;width:56px;height:56px;border-radius:50%;background:#fff7}.tbn{position:absolute;width:62px;height:62px;border-radius:50%;background:#0007;border:2px solid #fff6;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}.tbn.on{background:#f5c43088}#bFire{width:92px;height:92px;right:calc(24px + env(safe-area-inset-right));bottom:110px;background:#b0201a99}#bAds{right:128px;bottom:100px}#bJump{right:36px;bottom:212px}#bRel{right:110px;bottom:180px}#bUse{right:184px;bottom:160px;background:#1d6a5acc}#bDrop{right:200px;bottom:84px}#bPause{position:fixed;width:42px;height:42px;right:12px;top:142px;z-index:7;display:flex;align-items:center;justify-content:center;background:#0007;border:1px solid #fff5;color:#fff;pointer-events:auto}
body.touch .sl{width:64px;height:64px}body.touch .sl:first-child{width:72px;height:72px}body.touch #hpw{bottom:auto;top:12px;left:12px;width:200px}body.touch #ammoW{bottom:auto;top:150px;right:14px}body.touch #map{width:170px;height:85px}
#rot{display:none;position:fixed;inset:0;z-index:60;background:#0c0e11;align-items:center;justify-content:center}@media(orientation:portrait) and (pointer:coarse){#rot{display:flex}}</style></head><body>
<canvas id=g></canvas><div id=hud class=f><div id=boss><div id=bossN></div><div id=bossB><div id=bossH></div></div></div><canvas id=map width=240 height=120></canvas><div id=obj></div><div id=truckT>荷台 <span id=bedN>0</span>/5</div><div id=roomT></div>
<div id=hpw><div id=money></div><div class=lb>体力</div><div id=hpb><div id=hp></div></div></div>
<div id=slots><div class=sl id=sl0><b>手元</b><img><em></em></div><div class=sl id=sl1><b>リュック</b><img><em></em></div><div class=sl id=sl2><b>リュック</b><img><em></em></div></div>
<div id=ammoW><div id=magT>–</div><div id=ammoB>銃弾 <span id=ammoT>0</span>/300</div></div></div>
<div id=cross class=f></div><div id=hm class=f></div><div id=pr class=f></div><div id=toast class=f></div><div id=ban class=f></div>
<div id=tc><div id=joy><div id=joyK></div></div><div class=tbn id=bFire data-b=fire>撃つ</div><div class=tbn id=bAds data-b=ads>構え</div><div class=tbn id=bJump data-b=jump>跳ぶ</div><div class=tbn id=bRel data-b=rel>装填</div><div class=tbn id=bUse data-b=use>調べる</div><div class=tbn id=bDrop data-b=drop>落とす</div></div><button id=bPause>Ⅱ</button>
<div id=panel><div id=panelW><div id=panelH><span id=panelT></span><button class=sec id=panelX>閉じる</button></div><div id=panelB></div></div></div>
<div id=pause><div id=pauseW><h3>設定</h3>画質 <select id=qSel><option value=0>低（標準）</option><option value=1>中</option><option value=2>高（最高画質）</option></select><br>視点の感度 <input id=senS type=range min=.3 max=2.5 step=.1><div class=keysT>WASD移動／Shift走る／Space跳ぶ／左クリック撃つ・使う／右クリック構え／R装填／E調べる・拾う／G落とす／1〜3持ち替え／M地図／P設定</div><br><button class=big id=resume>戻る</button></div></div>
<div id=load><div id=loadT></div><div id=loadB><i></i></div></div>
<div id=title><div><h1>ガレージ<br>ハンターズ</h1><p>依頼を受け、ダンプに積み、自分で運び、巨大な敵を討つ。最大4人。</p><div class=tb><input id=nm placeholder=名前 maxlength=10 value=ハンター><button class="ch on">キャラ1</button><button class=ch>キャラ2</button><button class=ch>キャラ3</button></div><div class=tb><button class=big id=bSolo disabled>ひとりで遊ぶ</button><button class=sec id=bHost disabled>部屋を作る</button><input id=rm placeholder=部屋番号 size=8 inputmode=numeric><button class=sec id=bJoin disabled>部屋に入る</button></div><div id=ttMsg></div></div></div>
<div id=rot>スマホを横向きにしてください</div><script src=game.js></script></body></html>
